name: developer-preview

on:
  workflow_dispatch:
    inputs:
      version:
        description: Developer-preview version label
        required: true
        default: 0.0.1-dev.1
        type: string

permissions:
  contents: read

env:
  PREVIEW_VERSION: ${{ inputs.version }}

jobs:
  build:
    name: Build unsigned macOS preview
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true

      - name: Validate scripts
        run: |
          bash -n scripts/build-developer-preview.sh
          bash -n scripts/smoke-developer-preview.sh

      - name: Test
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 ./...

      - name: Vet
        run: go vet ./...

      - name: Build arm64 and amd64 preview archives
        run: |
          scripts/build-developer-preview.sh \
            --arch all \
            --version "${PREVIEW_VERSION}" \
            --output-dir dist

      - name: Smoke-test native archive without network
        run: |
          case "$(uname -m)" in
            arm64) preview_arch=arm64 ;;
            x86_64) preview_arch=amd64 ;;
            *) echo "unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          scripts/smoke-developer-preview.sh \
            "dist/belay-local-developer-preview-v${PREVIEW_VERSION}-darwin-${preview_arch}.tar.gz"

      - name: Upload short-lived workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: belay-local-developer-preview
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 3
