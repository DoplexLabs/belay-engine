name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true

      - name: Test
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 ./...

      - name: Race-sensitive tests
        run: go test -race ./internal/storage/local ./internal/pipeline ./internal/localapp

      - name: Vet
        run: go vet ./...

      - name: Static build
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -o /tmp/belay ./cmd/belay

      - name: Diff hygiene
        run: git diff --check

      - name: Alpha release-surface checks
        run: make verify-release-surface
